[project]
name = "errorinsight"
version = "1.0.0"
description = "CLI tool to extract suspicious error lines from clipboard logs."
requires-python = ">=3.11"
dependencies = [
    "pyperclip",
    "wcwidth",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
ei = "errorinsight.cli:main"
errorinsight = "errorinsight.cli:main"
